[project]
name = "ev-cvae"
version = "0.1.0"
description = "Synthetic Electric Vehicle Charging Session Generation Using a Conditional Variational Autoencoder"
authors = [
    { name = "Emilio J. Palacios-Garcia", email = "epalacios-garcia@ucc.ie" },
]
requires-python = ">=3.13,<3.14"
readme = "README.md"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pandas (>=3.0.2,<4.0.0)",
    "polars (>=1.39.3,<2.0.0)",
    "pyarrow (>=25.0.1,<26.0.0)",
    "numpy (>=2.4.4,<3.0.0)",
    "matplotlib (>=3.10.8,<4.0.0)",
    "scipy (>=1.17.1,<2.0.0)",
    "scikit-learn (>=1.8.0,<2.0.0)",
    "jupyterlab (>=4.5.6,<5.0.0)",
    "ipympl (>=0.10.0,<0.11.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "torch>=2.14.0",
    "pytorch-graph>=0.2.5",
    "tornado<6.5.9",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff (>=0.15.10,<0.16.0)",
    "mypy (>=1.20.1,<2.0.0)",
    "jupyterlab-code-formatter (>=3.1.0,<4.0.0)",
    "jupyterlab-git (>=0.54.1,<0.55.0)",
]
stub = ["scipy-stubs>=1.18.1.0"]

[[tool.mypy.overrides]]
ignore_missing_imports = true
module = ["torch", "torch.*", "sklearn.*"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # Pyflakes
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "I",   # isort
    "D",   # pydocstyle
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff]
line-length = 100

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 20
